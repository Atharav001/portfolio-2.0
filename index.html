<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored || (prefersLight ? 'light' : 'dark');
          if (theme === 'light') {
            document.documentElement.classList.add('light-theme');
          } else {
            document.documentElement.classList.remove('light-theme');
          }
          document.documentElement.dataset.theme = theme;
          
          window.addEventListener('DOMContentLoaded', function() {
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.content = theme === 'light' ? '#fafafa' : '#050508';
          });
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    

    
    <!-- SEO Optimization -->
    <meta name="theme-color" content="#050508" id="theme-color-meta" />
    <title>Atharav Narang | B.Tech CSE Portfolio</title>
    <meta name="description" content="Atharav Narang — second-year B.Tech Computer Science student at Manipal Institute of Technology. Software and ML projects, hackathons, and internships." />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Atharav Narang | B.Tech CSE Portfolio" />
    <meta property="og:description" content="B.Tech CSE student building software and ML projects. Open to software engineering internships." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://atharavnarang.com/" />
    <meta property="og:image" content="/assets/optimized/portfolio_v2.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Atharav Narang | B.Tech CSE Portfolio" />
    <meta name="twitter:description" content="B.Tech CSE student building software and ML projects." />
    <meta name="twitter:image" content="/assets/optimized/portfolio_v2.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
